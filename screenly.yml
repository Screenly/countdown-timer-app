---
syntax: manifest_v1
description: Screenly Countdown Edge App
icon: https://playground.srly.io/edge-apps/icons/countdown-timer.svg
author: Screenly, Inc.
categories:
  - Utilities
  - Productivity
ready_signal: true
settings:
  countdown_end_text:
    type: string
    default_value: Countdown Finished!
    title: Countdown End Text
    optional: false
    help_text:
      properties:
        display_order: 4
        help_text: Message displayed when the countdown reaches zero.
        type: string
      schema_version: 1
  countdown_headline:
    type: string
    default_value: New Year Countdown
    title: Countdown Headline
    optional: false
    help_text:
      properties:
        display_order: 1
        help_text: Headline text displayed above the countdown.
        type: string
      schema_version: 1
  display_errors:
    type: string
    default_value: 'false'
    title: Display Errors
    optional: true
    help_text:
      properties:
        advanced: true
        display_order: 7
        help_text: For debugging purposes to display errors on the screen.
        type: boolean
      schema_version: 1
  enable_analytics:
    type: string
    default_value: 'true'
    title: Enable Analytics
    optional: true
    help_text:
      properties:
        advanced: true
        display_order: 8
        help_text: Enable or disable Sentry and Google Analytics integrations.
        type: string
      schema_version: 1
    is_global: true
  override_locale:
    type: string
    default_value: en
    title: Override Locale
    optional: true
    help_text:
      properties:
        advanced: true
        display_order: 5
        help_text: |
          Override the default locale with a supported language code (e.g., en, fr, de). Defaults to English if not specified.
        type: string
      schema_version: 1
  override_timezone:
    type: string
    default_value: ''
    title: Override Timezone
    optional: true
    help_text:
      properties:
        advanced: true
        display_order: 6
        help_text: |
          Override the default timezone with a supported timezone identifier (e.g., Europe/London, America/New_York). Defaults to the system timezone if left blank.
        type: string
      schema_version: 1
  sentry_dsn:
    type: secret
    title: Sentry Client Key
    optional: true
    help_text:
      properties:
        advanced: true
        display_order: 9
        help_text: Enter your Sentry DSN to enable error tracking and monitoring.
        type: string
      schema_version: 1
    is_global: true
  starting_timestamp:
    type: string
    default_value: 2025-01-01T00:00:00
    title: Starting Timestamp
    optional: false
    help_text:
      properties:
        display_order: 3
        help_text: |
          The date and time the countdown begins (format: YYYY-MM-DDTHH:MM:SS), used to draw the progress bar. Leave it after the target to hide the bar.
        type: string
      schema_version: 1
  tag_manager_id:
    type: string
    default_value: GTM-P98SPZ9Z
    title: Google Tag Manager ID
    optional: true
    help_text:
      properties:
        advanced: true
        display_order: 10
        help_text: Enter your Google Tag Manager container ID to enable tracking and analytics.
        type: string
      schema_version: 1
    is_global: true
  target_timestamp:
    type: string
    default_value: 2028-01-01T00:00:00
    title: Countdown Target
    optional: false
    help_text:
      properties:
        display_order: 2
        help_text: |
          The date and time the countdown ends (format: YYYY-MM-DDTHH:MM:SS), in the screen's local timezone.
        type: string
      schema_version: 1
