<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
    >
      <main class="countdown">
        <h1 class="countdown-headline" data-headline></h1>

        <div class="countdown-digits" data-digits>
          <div class="countdown-unit" data-unit="day">
            <span class="countdown-value" data-value>0</span>
            <span class="countdown-label" data-label>days</span>
          </div>
          <span class="countdown-sep" aria-hidden="true">:</span>
          <div class="countdown-unit" data-unit="hour">
            <span class="countdown-value" data-value>00</span>
            <span class="countdown-label" data-label>hours</span>
          </div>
          <span class="countdown-sep" aria-hidden="true">:</span>
          <div class="countdown-unit" data-unit="minute">
            <span class="countdown-value" data-value>00</span>
            <span class="countdown-label" data-label>minutes</span>
          </div>
          <span class="countdown-sep" aria-hidden="true">:</span>
          <div class="countdown-unit is-accent" data-unit="second">
            <span class="countdown-value" data-value>00</span>
            <span class="countdown-label" data-label>seconds</span>
          </div>
        </div>

        <p class="countdown-finished" data-finished></p>
        <p class="countdown-invalid">Invalid countdown target</p>

        <footer class="countdown-meta">
          <div class="countdown-progress" data-progress>
            <div class="countdown-progress-fill" data-progress-fill></div>
          </div>
          <div class="countdown-dates">
            <span data-start-date></span>
            <span class="countdown-target" data-target-date>--</span>
          </div>
        </footer>
      </main>
    </auto-scaler>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
